<div class="login-page">

  <div class="login-container">

    <!-- Left Side -->

    <div class="login-left">

      <img
        src="/assets/images/login.png"
        alt="Login">

    </div>

    <!-- Right Side -->

    <div class="login-right">

      <h1>Hello,</h1>

      <h2>Welcome Back</h2>

      <p>
        Sign in to continue
      </p>

      <div class="form-group">

        <input
          type="email"
          [(ngModel)]="email"
          placeholder="Email">

      </div>

      <div class="form-group">

        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Password">

      </div>

      <div class="forgot-link">

        <a routerLink="/forgot-password">

          Forgot Password?

        </a>

      </div>

      <button
        class="login-btn"
        (click)="login()">

        Login

      </button>

      <div class="register">

        Don't have an account?

        <a routerLink="/register">

          Register

        </a>

      </div>

    </div>

  </div>

</div>
