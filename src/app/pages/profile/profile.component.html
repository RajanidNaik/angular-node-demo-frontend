<div class="container">

  <div class="card">

    <h2>My Profile</h2>
<div class="profile-image">

  <img
    [src]="profileImageUrl"
    alt="Profile"
    class="avatar">

  <label
    for="profileUpload"
    class="camera-btn">

    <i class="fa-solid fa-camera"></i>

  </label>

  <input
    id="profileUpload"
    type="file"
    accept="image/*"
    hidden
    (change)="onFileSelected($event)">

</div>

    <form
      [formGroup]="profileForm">

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          formControlName="name">

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          formControlName="email">

      </div>

      <div class="form-group">

        <label>Role</label>

        <input
          type="text"
          formControlName="role">

      </div>

      <div class="form-group">

        <label>Department</label>

        <input
          type="text"
          formControlName="department">

      </div>

      <div class="form-group">

        <label>Designation</label>

        <input
          type="text"
          formControlName="designation">

      </div>

      <div class="form-group">

        <label>Phone</label>

        <input
          type="text"
          formControlName="phone">

      </div>

      <br>

      <button

        type="button"

        class="btn-primary"

        (click)="updateProfile()">

        Update Profile

      </button>

    </form>

  </div>

  <br>

  <div class="card">

    <h2>Change Password</h2>

    <form
      [formGroup]="passwordForm">

      <div class="form-group">

        <label>Current Password</label>

        <input

          type="password"

          formControlName="currentPassword">

      </div>

      <div class="form-group">

        <label>New Password</label>

        <input

          type="password"

          formControlName="newPassword">

      </div>

      <br>

      <button

        type="button"

        class="btn-primary"

        (click)="changePassword()">

        Change Password

      </button>

    </form>

  </div>

</div>
