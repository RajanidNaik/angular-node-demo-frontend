<h2>

  {{ customer
      ? 'Edit Customer'
      : 'Add Customer' }}

</h2>

<form
  [formGroup]="customerForm">

  <div class="form-group">

    <label>Name</label>

    <input
      type="text"
      formControlName="name">

  </div>

  <div class="form-group">

    <label>Email</label>

    <input
      type="email"
      formControlName="email">

  </div>

  <div class="form-group">

    <label>Age</label>

    <input
      type="number"
      formControlName="age">

  </div>

  <div class="form-group">

    <label>City</label>

    <input
      type="text"
      formControlName="city">

  </div>

  <br>

  <button
    type="button"
    class="btn-primary"
    (click)="saveCustomer()">

    Save

  </button>

  &nbsp;

  <button
    type="button"
    class="btn-secondary"
    (click)="cancel()">

    Cancel

  </button>

</form>
