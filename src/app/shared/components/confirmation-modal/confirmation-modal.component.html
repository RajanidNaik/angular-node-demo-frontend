<div
  class="modal-overlay"
  *ngIf="visible">

  <div class="modal">

    <div class="modal-header">

      <h2>{{ title }}</h2>

    </div>

    <div class="modal-body">

      <p>{{ message }}</p>

    </div>

    <div class="modal-footer">

      <button
        class="btn-secondary"
        (click)="onCancel()">

        Cancel

      </button>

      <button
        class="btn-danger"
        (click)="onConfirm()">

        Delete

      </button>

    </div>

  </div>

</div>
